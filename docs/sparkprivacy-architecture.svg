<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-labelledby="t d"><title id="t">SparkPrivacy implemented local-first architecture</title><desc id="d">Operator desktop runs UI, loopback-protected API, DLP classifier and policies, local SQLite metadata, PDF reports, and optional system OpenSSH tunnel to DGX Spark. Only local or SSH-tunneled model endpoint is permitted.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#153042"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="#60E6C4"/></marker></defs>
<style>.line{stroke:#67E6C3;stroke-width:2;stroke-dasharray:8 10;animation:move 7s linear infinite;fill:none}@keyframes move{to{stroke-dashoffset:-110}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style>
<rect width="1280" height="570" rx="22" fill="url(#b)"/><text x="50" y="55" font-family="Arial,sans-serif" font-size="29" fill="#E9FAFF" font-weight="700">SparkPrivacy — Trust boundaries</text><text x="50" y="84" font-family="Arial,sans-serif" font-size="15" fill="#9ABAC9">Implemented local controller and optional OpenSSH path. No hosted SaaS or remote SparkPrivacy agent.</text>
<rect x="36" y="111" width="892" height="383" rx="19" fill="#0F2737" stroke="#31596D"/><text x="58" y="146" font-family="Arial,sans-serif" font-size="16" fill="#A3F6DB" font-weight="700">OPERATOR PC · WINDOWS / MACOS / LINUX</text>
<g font-family="Arial,sans-serif">
<rect x="60" y="167" width="271" height="81" rx="11" fill="#1A384A" stroke="#417387"/><text x="80" y="200" font-size="17" font-weight="700" fill="#F0F9FF">Desktop / browser UI</text><text x="80" y="224" font-size="12" fill="#AEC9D6">Local responsive workspace</text>
<rect x="383" y="167" width="520" height="81" rx="11" fill="#1A384A" stroke="#417387"/><text x="403" y="200" font-size="17" font-weight="700" fill="#F0F9FF">Authenticated loopback API</text><text x="403" y="224" font-size="12" fill="#AEC9D6">Random session token · Host / Origin · bounded JSON</text>
<rect x="60" y="331" width="271" height="95" rx="11" fill="#1A384A" stroke="#417387"/><text x="80" y="365" font-size="17" font-weight="700" fill="#F0F9FF">Classifier + policies</text><text x="80" y="391" font-size="12" fill="#AEC9D6">Block / redact / monitor</text>
<rect x="354" y="331" width="256" height="95" rx="11" fill="#1A384A" stroke="#417387"/><text x="374" y="365" font-size="17" font-weight="700" fill="#F0F9FF">Metadata-only SQLite</text><text x="374" y="391" font-size="12" fill="#AEC9D6">Events · policy settings</text>
<rect x="633" y="331" width="270" height="95" rx="11" fill="#1A384A" stroke="#417387"/><text x="653" y="365" font-size="17" font-weight="700" fill="#F0F9FF">PDF assessment</text><text x="653" y="391" font-size="12" fill="#AEC9D6">Category counts · limitations</text>
</g>
<path class="line" d="M331 207H382" marker-end="url(#arrow)"/><path class="line" d="M522 248V291H195V330" marker-end="url(#arrow)"/><path class="line" d="M540 248V291H480V330" marker-end="url(#arrow)"/><path class="line" d="M558 248V308H768V330" marker-end="url(#arrow)"/>
<rect x="963" y="148" width="281" height="260" rx="17" fill="#173543" stroke="#4A8A8D" stroke-dasharray="6 6"/><text x="985" y="185" font-family="Arial,sans-serif" font-size="19" fill="#E7FBFF" font-weight="700">DGX Spark / Linux</text><text x="985" y="220" font-family="Arial,sans-serif" font-size="14" fill="#B5D2DB">Optional strict OpenSSH</text><text x="985" y="249" font-family="Arial,sans-serif" font-size="14" fill="#B5D2DB">Read-only host checks</text><text x="985" y="280" font-family="Arial,sans-serif" font-size="14" fill="#B5D2DB">Private port forward</text><text x="985" y="312" font-family="Arial,sans-serif" font-size="14" fill="#B5D2DB">Existing local LLM API</text><text x="985" y="354" font-family="Arial,sans-serif" font-size="12" fill="#94EFD4">No remote agent installed</text>
<path class="line" d="M903 206H948V262H962" marker-end="url(#arrow)"/><text x="950" y="192" font-family="Arial,sans-serif" font-size="12" fill="#8EE8CE" text-anchor="end">SSH · loopback tunnel</text>
<text x="50" y="525" font-family="Arial,sans-serif" font-size="14" fill="#A0C2CA">Model input and output both pass through the local policy engine. No original content intentionally persisted.</text><text x="50" y="547" font-family="Arial,sans-serif" font-size="12" fill="#7E9AA9">Illustrative data paths, not proof of real-device acceptance, enterprise DLP accuracy or production accreditation.</text>
</svg>
