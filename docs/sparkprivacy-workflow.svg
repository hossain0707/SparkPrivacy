<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 342" width="1280" height="342" role="img" aria-labelledby="t d"><title id="t">SparkPrivacy policy enforcement workflow</title><desc id="d">Illustrative animated process: inspect input, classify detected patterns, apply policy, route allowed text to local AI, check model output, and log metadata.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#081624"/><stop offset="1" stop-color="#142D40"/></linearGradient></defs>
<style>.path{stroke-dasharray:10 13;animation:move 7s linear infinite}.pulse{animation:glow 4s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-120}}@keyframes glow{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.path,.pulse{animation:none}}</style>
<rect width="1280" height="342" rx="20" fill="url(#b)"/><text x="49" y="57" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#F0FAFF">The private AI data boundary</text><text x="50" y="88" font-family="Arial,sans-serif" font-size="14" fill="#9EBCCC">Policy enforcement on requests and responses. No raw content retained in audit logs.</text>
<path class="path" d="M90 166H1190" fill="none" stroke="#63E4BD" stroke-width="2.5"/>
<g font-family="Arial,sans-serif">
<rect x="35" y="126" width="184" height="141" rx="14" fill="#153140" stroke="#3A6473"/><rect x="50" y="146" width="46" height="30" rx="9" fill="#255349"/><text x="73" y="167" font-size="13" font-weight="700" fill="#AEFFE5" text-anchor="middle">01</text><text x="50" y="211" font-size="19" fill="#E5F9FE" font-weight="700">Inspect</text><text x="50" y="240" font-size="11" fill="#9FC0CB">Prompt text</text>
<rect x="240" y="126" width="184" height="141" rx="14" fill="#153140" stroke="#3A6473"/><rect x="255" y="146" width="46" height="30" rx="9" fill="#255349"/><text x="278" y="167" font-size="13" font-weight="700" fill="#AEFFE5" text-anchor="middle">02</text><text x="255" y="211" font-size="19" fill="#E5F9FE" font-weight="700">Classify</text><text x="255" y="240" font-size="11" fill="#9FC0CB">Category findings</text>
<rect x="445" y="126" width="184" height="141" rx="14" fill="#153140" stroke="#3A6473"/><rect x="460" y="146" width="46" height="30" rx="9" fill="#255349"/><text x="483" y="167" font-size="13" font-weight="700" fill="#AEFFE5" text-anchor="middle">03</text><text x="460" y="211" font-size="19" fill="#E5F9FE" font-weight="700">Enforce</text><text x="460" y="240" font-size="11" fill="#9FC0CB">Block / redact / monitor</text>
<rect x="650" y="126" width="184" height="141" rx="14" fill="#153140" stroke="#3A6473"/><rect x="665" y="146" width="46" height="30" rx="9" fill="#255349"/><text x="688" y="167" font-size="13" font-weight="700" fill="#AEFFE5" text-anchor="middle">04</text><text x="665" y="211" font-size="19" fill="#E5F9FE" font-weight="700">Route</text><text x="665" y="240" font-size="11" fill="#9FC0CB">Local LLM only</text>
<rect x="855" y="126" width="184" height="141" rx="14" fill="#153140" stroke="#3A6473"/><rect x="870" y="146" width="46" height="30" rx="9" fill="#255349"/><text x="893" y="167" font-size="13" font-weight="700" fill="#AEFFE5" text-anchor="middle">05</text><text x="870" y="211" font-size="19" fill="#E5F9FE" font-weight="700">Recheck</text><text x="870" y="240" font-size="11" fill="#9FC0CB">Assistant output</text>
<rect x="1060" y="126" width="184" height="141" rx="14" fill="#153140" stroke="#3A6473"/><rect x="1075" y="146" width="46" height="30" rx="9" fill="#255349"/><text x="1098" y="167" font-size="13" font-weight="700" fill="#AEFFE5" text-anchor="middle">06</text><text x="1075" y="211" font-size="19" fill="#E5F9FE" font-weight="700">Audit</text><text x="1075" y="240" font-size="11" fill="#9FC0CB">Metadata only</text></g>
<text x="49" y="313" font-family="Arial,sans-serif" font-size="12" fill="#8BA9BB">Animated conceptual workflow · Unsupported streaming and non-text payloads are not forwarded</text>
</svg>
