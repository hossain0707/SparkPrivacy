[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkprivacy"
version = "0.1.1"
description = "Local-first data protection workbench and policy gateway for private AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Md Najmul Hossain"}]
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "reportlab>=4.1,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
desktop = ["pywebview>=5,<7", "pyinstaller>=6.5,<7"]

[project.scripts]
sparkprivacy = "sparkprivacy.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sparkprivacy*"]

[tool.setuptools.package-data]
sparkprivacy = ["frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sparkprivacy"]
